name: SCA — Trivy gate (CRITICAL/HIGH)

on:
  push:
    branches: [main, phase-a, phase-b]
  pull_request:
    branches: [main]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - angular-app
          - catalog-microservice
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.target == 'catalog-microservice'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet (lock files for Trivy)
        if: matrix.target == 'catalog-microservice'
        run: |
          dotnet restore catalog-microservice/CatalogMicroservice/CatalogMicroservice.csproj
          dotnet restore catalog-microservice/Middleware/Middleware.csproj

      - name: Setup Node
        if: matrix.target == 'angular-app'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: angular-app/package-lock.json

      - name: Install npm dependencies
        if: matrix.target == 'angular-app'
        working-directory: angular-app
        run: npm ci

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ./${{ matrix.target }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table
